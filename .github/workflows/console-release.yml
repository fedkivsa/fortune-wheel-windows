name: Console release
on:
  push:
    branches: [prototype/console]
    paths: [.github/workflows/console-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: console-release-v0.1.0
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core checks
        run: dotnet run --project tests/FortuneWheel.Checks -c Release
      - name: Publish with bundled runtime
        run: dotnet publish src/FortuneWheel.Console -c Release -r ${{ matrix.rid }} --self-contained true -o package
      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "./package/FortuneWheel.Console.exe" } else { "./package/FortuneWheel.Console" }
          & $exe --config ./package/fortune-wheel.ini --once --no-animation
          if ($LASTEXITCODE -ne 0) { throw "Published app smoke test failed" }
          Copy-Item src/FortuneWheel.Console/README.md package/README.md
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath fortune-wheel-console-${{ matrix.rid }}.zip
      - name: Archive Unix package
        if: runner.os != 'Windows'
        run: tar -czf fortune-wheel-console-${{ matrix.rid }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.rid }}
          path: fortune-wheel-console-${{ matrix.rid }}.*
          if-no-files-found: error
  release:
    needs: package
    if: github.ref == 'refs/heads/prototype/console'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: console-*
          merge-multiple: true
          path: dist
      - name: Publish console prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum fortune-wheel-console-* > SHA256SUMS.txt
          cat > ../release-notes.md <<'NOTES'
          First console prototype from the prototype/console branch.

          - Animated stationary text wheel with a moving pointer.
          - 1–5 players, relative field shares, shuffled spin order.
          - Signed force, positive drag, optional impulse variation, two-second pauses.
          - Interactive settings editor and compatible INI loading/saving.
          - Bundled .NET runtime: no SDK or separate .NET installation needed.

          Downloads:
          - Windows x64: extract the ZIP and run FortuneWheel.Console.exe in Windows Terminal.
          - Linux x64: extract the tar.gz and run ./FortuneWheel.Console.
          - macOS Apple Silicon: extract the tar.gz and run ./FortuneWheel.Console.

          Keep all extracted files together. An ANSI terminal of at least 80 × 35 characters is recommended.
          Use --once --no-animation for an immediate result without terminal animation.
          Packages are unsigned. Core checks and published-executable smoke tests run on all three platforms.
          NOTES
          gh release create console-v0.1.0 fortune-wheel-console-* SHA256SUMS.txt --target "$RELEASE_COMMIT" --title "Console v0.1.0" --notes-file ../release-notes.md --prerelease --draft
          gh release edit console-v0.1.0 --draft=false
