name: Windows build
on:
  push:
    branches: [main, prototype/rotating-pointer, prototype/web]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: '24'
      - name: Browser core checks
        if: hashFiles('web/package.json') != ''
        run: npm test
        working-directory: web
      - name: Core behavior checks
        run: dotnet run --project tests/FortuneWheel.Checks -c Release
      - name: Build WPF
        run: dotnet build src/FortuneWheel/FortuneWheel.csproj -c Release
      - name: Publish portable Windows app
        run: dotnet publish src/FortuneWheel/FortuneWheel.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-x64
      - name: Check Windows app starts
        shell: pwsh
        run: |
          $app = Start-Process ./artifacts/windows-x64/FortuneWheel.exe -PassThru
          try {
            if ($app.WaitForExit(5000)) { throw "The app exited during startup (code $($app.ExitCode))." }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: fortune-wheel-windows-x64
          path: artifacts/windows-x64/
