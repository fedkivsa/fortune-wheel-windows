name: Console
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  console:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/FortuneWheel.Console -c Release
      - run: dotnet run --project tests/FortuneWheel.Checks -c Release
      - run: dotnet run --project src/FortuneWheel.Console -c Release --no-build -- --once --no-animation
